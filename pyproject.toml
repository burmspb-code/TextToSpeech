[project]
name = "texttospeech"
version = "0.1.0"
description = "Офлайн-приложение для синтеза речи из текста (Piper, Silero + PyQt6)"
authors = [
    {name = "Mikhail Burdukovsky",email = "burmspb@gmail.com"}
]
readme = "README.md"
# torch 2.11 тянет triton с ограничением <3.15 — сужаем диапазон честно.
requires-python = ">=3.14,<3.15"

# Основной движок — полностью офлайн, работает на CPU.
dependencies = [
    "piper-tts (>=1.8.0)",
    "pyqt6 (>=6.8)",
    "requests (>=2.32)",
]

[project.optional-dependencies]
# Онлайн-движок Microsoft. Лучшее качество, но требует сеть и доступ
# к серверам Microsoft — в ряде регионов синтез блокируется.
edge = [
    "edge-tts (>=7.2)",
]

# Офлайн-движник на PyTorch. Тянет ~2.5 ГБ, качество ниже Piper.
silero = [
    "silero-tts (>=0.0.5)",
    # Версии torch и torchaudio должны совпадать: с 2.14/2.11 импорт
    # проходит, но это несовместимое сочетание.
    "torch (>=2.11,<2.12)",
    "torchaudio (>=2.11,<2.12)",
]

# PEP 735. В отличие от extras, ставится автоматически вместе с основными
# зависимостями — pytest нужен всегда.
[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "ruff (>=0.17.6)",
]

[project.gui-scripts]
texttospeech = "texttospeech.app:main"

[tool.poetry]
packages = [
    {include = "texttospeech", from = "src"},
]
include = ["src/texttospeech/assets/tts.png"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: тесты, которые реально синтезируют речь",
]
